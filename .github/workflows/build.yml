name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm install
        working-directory: Frontend

      - name: Build frontend
        run: npm run build
        working-directory: Frontend

      - name: Copy frontend dist to backend wwwroot
        shell: bash
        run: |
          rm -rf Backend/YdcViewer.Api/wwwroot
          cp -r Frontend/dist Backend/YdcViewer.Api/wwwroot

      - name: Restore backend
        run: dotnet restore YdcViewer.slnx

      - name: Build backend
        run: dotnet build YdcViewer.slnx --no-restore -c Release

      - name: Run backend tests
        run: dotnet test YdcViewer.slnx --no-build -c Release --verbosity normal

      - name: Publish
        run: dotnet publish Backend/YdcViewer.Api -c Release -o publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ydcviewer-${{ matrix.os }}
          path: publish/
          retention-days: 7
